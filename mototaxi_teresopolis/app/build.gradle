plugins {
    id 'com.android.application' version '8.7.3'
}

def keystorePropertiesFile = new File(System.getProperty("user.home"), ".config/mototaxi/keystore.properties")
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'br.com.mototaxi.teresopolis'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.mototaxi.teresopolis'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword System.getenv("MOTOTAXI_STORE_PASSWORD")
            keyAlias keystoreProperties['keyAlias']
            keyPassword System.getenv("MOTOTAXI_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

android {
    lint {
        checkReleaseBuilds false
    }
}
